name: Exact candidate checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python code/check_below_identity.py
      - run: python -O code/check_below_identity.py --negative-control
      - run: python -O code/verify_release.py --quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-replay-logs
          path: runs/
